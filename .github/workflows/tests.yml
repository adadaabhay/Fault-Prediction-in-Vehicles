name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Editable install so `python -m tools.*` resolves the same
          # way locally and on CI (the flat layout means we cannot
          # rely on PYTHONPATH alone).
          pip install -e ".[dev]"
          # Headless browser smoke test (tests/test_hud_smoke.py).
          # The test class is skip-aware: a missing binary or package
          # shows as SKIP, not ERROR, so the rest of the suite still
          # runs.  See tests/test_hud_smoke.py docstring.
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Fail if the label-leakage guards were skipped
        run: |
          # test_leakage.py skips its classifier assertions without
          # scikit-learn. A skipped leakage gate is indistinguishable from a
          # passing one in the summary line, and leakage is the defect that
          # invalidated every number this project reported.
          python -m pytest tests/test_leakage.py -q -rs 2>&1 | tee leak.txt
          if grep -qi "skipped" leak.txt; then
            echo "::error::label-leakage suite skipped -- install scikit-learn"
            exit 1
          fi

      - name: Verify published artifacts are self-consistent
        run: python -m tools.check_artifacts

      - name: Verify docs links are not 404
        run: python -m tools.check_links

      - name: Check JS syntax
        run: |
          for f in docs/*.js; do
            node --check "$f"
          done
