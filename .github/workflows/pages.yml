name: Deploy dashboard to GitHub Pages

# Deploys from any active branch rather than one hardcoded name.
# This pinned `Feat/Sheena` while development moved elsewhere, so the
# published dashboard served code that no longer existed in the working
# tree -- the deployed artifact and the reviewed artifact were different
# things, with nothing on the page to indicate it.
on:
  push:
    branches: [main, master, Feat/Sheena, fix/phm-audit-remediation]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify published artifacts are self-consistent
        run: python -m tools.check_artifacts

      - name: Verify docs links are not 404
        run: python -m tools.check_links

      - name: Check dashboard JavaScript syntax
        run: for f in docs/*.js; do node --check "$f"; done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
